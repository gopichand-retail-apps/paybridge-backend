paybridge.local-profile-login-enabled=${LOCAL_PROFILE_LOGIN_ENABLED:false}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/paybridge}
spring.datasource.username=${DATABASE_USERNAME:paybridge}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.servlet.session.cookie.secure=true
paybridge.require-webhook-secret=true