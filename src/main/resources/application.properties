paybridge.local-profile-login-enabled=${LOCAL_PROFILE_LOGIN_ENABLED:true}
spring.application.name=paybridge-api
server.address=${HOST:127.0.0.1}
server.port=${PORT:5602}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.local/paybridge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
paybridge.frontend-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5601}
paybridge.webhook.secret=${PAYBRIDGE_WEBHOOK_SECRET:}
paybridge.require-webhook-secret=${REQUIRE_WEBHOOK_SECRET:false}
logging.structured.format.console=logstash